<div class="saberstyle-fab" (click)="toggleChat()" [class.fab-hidden]="isChatOpen">
    <ion-icon name="chatbubbles"></ion-icon>
    <span class="fab-badge" *ngIf="!isChatOpen">IA</span>   
</div>

<div class="saberstyle-overlay" *nglf="isChatOpen">
    <div class="saberstyle-chat-panel">

        <div class="chat-panel-header">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <ion-icon name="style"></ion-icon>
                </div>
                <div>
                    <h4>sTAIle</h4>
                    <span class="chat-status">Online</span>
                </div>
            </div>
            <div class="chat-header-actions">
                <ion-button fill="clear" size="small" (click)="clearChat()" title="Limpiar chat">
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-button>
                <ion-button fill="clear" size="small" (click)="clearChat()" title="Cerrar">
                    <ion-icon name="close" slot="icon-only"></ion-icon>
                </ion-button>
            </div>
        </div>
        <div class="chat-panel-body" #chatBody>
            
            <div class="chat welcome" *nglf="chatMessages.length === 0">
                <ion-icon name="chatbubbles-outline"></ion-icon>
                <p>Hola soy <strong>StAIle</strong>, tu asiste de SaberStyle. Que quiere hacer hoy?</p>
            </div>
            
            <div class="chat-suggestions" *nglf="chatMessages.length === 0">
                <ion-chip* ngFor="let sug of chatSuggestions" outline color="primary" (click)="sendChatFromSuggestion(sug)">
                    <ion-label>{{ sug }}</ion-label>
                </ion-chip>
            </div> 

            <div *ngFor="let msg of chatMessages"
                 class="chat-msg"
                 [class.chat-msg-user]="msg.role === user"
                 [class.chat-msg-bot]="msg.role === assistant">
              <div class="chat-msg-avatar" *nglf="msg.role === 'assistant'">
                <ion-icon name="style"></ion-icon>
              </div>
              <div class="chat-msg-bubble">
                <p>{{ msg.content }}</p>
                <span class="chat-msg-time">{{msg.timestamp | date:'shortTime'}}</span>
              </div>
            </div>

            <div class="chat-msg chat-msg-bot" *nglf="isChatLoading">
                <div class="chat-msg-avatar">
                    <ion-icon name="style"></ion-icon>
                </div>
                <div class="chat-msg-bubble typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
        <div class="chat-panel-footer">
            <imput
            type="text"
            [(ngModel)]="chatInput"
            placeholder="Escribe un mensaje"
            (keydown.enter)="sendChatMessage()"
            [disabled]="isChatLoading"
            class="chat-text-input" />
            <ion-button fill="solid" color="primary" shape="round" size="small"
                        [disabled]="!chatInput || !chatInput.trim() || isChatLoading"
                        (click)="sendChatMessage()">
                <ion-icon name="send" slot="icon-only"></ion-icon>    
            </ion-button>
        </div>
    </div>    
</div>
